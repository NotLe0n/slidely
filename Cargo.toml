[package]
name = "slidely"
version = "0.2.0"
edition = "2024"

[dependencies]
gpui-kit = "0.8"
rfd = "0.17.2"
hayro = "0.8.0"
image = { version = "0.25", default-features = false }
anyhow = "1.0.104"
futures = "0.3"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gstreamer = "0.25"
gstreamer-app = "0.25"
gpui-video-player = { version = "0.1.3", default-features = false, features = [
	"gpui-pre",
] }

# Whisper runs on the GPU: through Metal on macOS, which has no native Vulkan,
# and through Vulkan everywhere else.
[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "0.16", features = ["metal"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
whisper-rs = { version = "0.16", features = ["vulkan"] }

[profile.dev.package."*"]
opt-level = 3

# ci build without optimizations to run faster
[profile.ci]
inherits = "dev"
debug = false

[profile.ci.package."*"]
opt-level = 0

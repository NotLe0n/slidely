[package]
name = "slidely"
version = "0.1.0"
edition = "2024"

[dependencies]
gpui-kit = "0.7"
rfd = "0.17.2"
hayro = "0.8.0"
image = { version = "0.25", default-features = false }
anyhow = "1.0.104"
futures = "0.3"
rayon = "1"
gpui-video-player = { git = "https://github.com/getong/gpui-video-player", branch = "support-gpui-pre", default-features = false, features = ["gpui-pre"]}

[profile.dev.package."*"]
opt-level = 3

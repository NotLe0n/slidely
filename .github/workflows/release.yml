# Builds slidely in release mode for Linux, Windows and macOS, bundles it with the
# Whisper and Silero VAD models, and publishes the bundles as a GitHub release.
# Run it by hand from the Actions tab.
name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag for the release (e.g. v0.1.0). Created on the selected commit if it doesn't exist.
        required: true
      prerelease:
        description: Mark the release as a pre-release
        type: boolean
        default: false

permissions:
  contents: write

env:
  # Otherwise ggml is tuned for the runner's CPU and may crash on older ones.
  GGML_NATIVE: "OFF"

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-24.04
          - name: windows-x86_64
            os: windows-latest
          - name: macos-aarch64
            os: macos-latest
    runs-on: ${{ matrix.os }}
    env:
      BUNDLE: slidely-${{ inputs.tag }}-${{ matrix.name }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: Build
        run: cargo build --release --locked

      - name: Cache models
        id: models
        uses: actions/cache@v6
        with:
          path: models
          key: models-ggml-small-q5_1-ggml-silero-v5.1.2

      - name: Download models
        if: steps.models.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p models
          curl -fL --retry 3 -o models/ggml-small-q5_1.bin https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-small-q5_1.bin
          curl -fL --retry 3 -o models/ggml-silero-v5.1.2.bin https://huggingface.co/ggml-org/whisper-vad/resolve/main/ggml-silero-v5.1.2.bin

      # The app looks for models/ in the working directory, so they go next to
      # the binary and slidely is started from the bundle's directory. FFmpeg and
      # libmpv come from the system (Linux) or Homebrew (macOS).
      - name: Bundle (Linux, macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p "dist/$BUNDLE"
          cp target/release/slidely README.md "dist/$BUNDLE/"
          cp -r models "dist/$BUNDLE/models"
          tar -C dist -czf "dist/$BUNDLE.tar.gz" "$BUNDLE"

      # Windows has no system FFmpeg or libmpv, so the bundle carries the MSYS2
      # (UCRT64) DLLs slidely links against, next to slidely.exe.
      - name: Bundle (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          out="dist/$BUNDLE"
          mkdir -p "$out"
          cp target/release/slidely.exe README.md "$out/"
          cp -r models "$out/models"
          ldd "$out/slidely.exe" \
            | awk '$3 ~ /^\/ucrt64\// { print $3 }' | sort -u | xargs -I{} cp {} "$out/"
          (cd dist && zip -qr "$BUNDLE.zip" "$BUNDLE")

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: dist/${{ env.BUNDLE }}.*
          if-no-files-found: error
          compression-level: 0

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          flags=()
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          gh release create "$TAG" dist/* \
            --target "$GITHUB_SHA" \
            --title "slidely $TAG" \
            --generate-notes \
            "${flags[@]}"

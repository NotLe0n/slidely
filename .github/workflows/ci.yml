# Builds slidely and runs its tests on every push.
name: CI

on:
  push:

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      - name: Build
        run: cargo build --locked --profile ci

      - name: Test
        run: cargo test --locked --profile ci

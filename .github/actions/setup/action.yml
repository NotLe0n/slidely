# Installs Rust and the native dependencies slidely builds against (GStreamer,
# Vulkan or Metal, CMake, a C/C++ compiler), the same ones README.md lists.
name: Set up build
description: Install Rust and slidely's native build dependencies

runs:
  using: composite
  steps:
    # Defender scans every file the compiler and pacman write, which makes
    # builds on Windows runners several times slower.
    - name: Disable Defender real-time scanning (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: Set-MpPreference -DisableRealtimeMonitoring $true

    - name: Install dependencies (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake clang pkg-config \
          libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
          libvulkan-dev glslc \
          libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev libfontconfig-dev libssl-dev
        # .cargo/config.toml points VULKAN_SDK at MSYS2; the system Vulkan lives in /usr.
        echo "VULKAN_SDK=/usr" >> "$GITHUB_ENV"

    # Homebrew's gstreamer formula includes the plugins. whisper.cpp uses Metal,
    # which comes with Xcode.
    - name: Install dependencies (macOS)
      if: runner.os == 'macOS'
      shell: bash
      env:
        HOMEBREW_NO_AUTO_UPDATE: "1"
        HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: "1"
      run: brew install gstreamer pkgconf cmake

    - name: Install Rust (Linux, macOS)
      if: runner.os != 'Windows'
      shell: bash
      run: rustup toolchain install stable --profile minimal && rustup default stable

    # The runner image ships MSYS2 at C:\msys64, which is where .cargo/config.toml
    # expects it; `release: false` uses that one instead of installing another.
    - name: Install dependencies (Windows)
      if: runner.os == 'Windows'
      uses: msys2/setup-msys2@v2
      with:
        msystem: UCRT64
        release: false
        update: true
        install: >-
          mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-cmake mingw-w64-ucrt-x86_64-ninja mingw-w64-ucrt-x86_64-clang
          mingw-w64-ucrt-x86_64-pkgconf mingw-w64-ucrt-x86_64-gstreamer mingw-w64-ucrt-x86_64-gst-plugins-base
          mingw-w64-ucrt-x86_64-gst-plugins-good mingw-w64-ucrt-x86_64-gst-plugins-bad mingw-w64-ucrt-x86_64-gst-libav
          mingw-w64-ucrt-x86_64-vulkan-headers mingw-w64-ucrt-x86_64-vulkan-loader mingw-w64-ucrt-x86_64-shaderc
          zip

    # MSYS2's ucrt64 has to come before the other MinGW installs on the runner,
    # or whisper.cpp is built by a gcc whose runtime doesn't match the DLLs.
    # libclang for bindgen comes from MSYS2 too, not from the runner's
    # MSVC-targeting LLVM.
    - name: Configure environment (Windows)
      if: runner.os == 'Windows'
      shell: bash
      run: |
        echo "C:\\msys64\\ucrt64\\bin" >> "$GITHUB_PATH"
        echo "LIBCLANG_PATH=C:\\msys64\\ucrt64\\bin" >> "$GITHUB_ENV"

    - name: Install Rust (Windows)
      if: runner.os == 'Windows'
      shell: bash
      run: |
        rustup toolchain install stable-x86_64-pc-windows-gnu --profile minimal
        rustup default stable-x86_64-pc-windows-gnu

    - name: Cache Cargo
      uses: Swatinem/rust-cache@v2
      with:
        # Keeps the whisper.cpp build even when a later step fails.
        cache-on-failure: true
